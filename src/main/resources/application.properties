spring.application.name=Rifd

spring.datasource.url=jdbc:mysql://localhost:3306/rifd?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# AI service (any failure / timeout -> rule-based fallback)
ai.base-url=https://basmaalmuntaser-expo-ops-ai.hf.space
ai.timeout-ms=8000
ai.warmup-timeout-ms=90000
ai.enabled=true
ai.min-confidence=0.5

# AI 2 (ExpoGuard): fire/smoke detection on photos. Any failure / timeout -> the photo goes on with the Gemini description only
# private Hugging Face Space: the token comes from the HF_TOKEN environment variable (never written here)
vision-ai.enabled=true
vision-ai.base-url=https://basmaalmuntaser-expoguard-ai.hf.space
vision-ai.token=${HF_TOKEN:}
vision-ai.timeout-ms=10000
vision-ai.warmup-timeout-ms=120000
vision-ai.min-confidence=0.45

# merging
merge.threshold=0.6
merge.max-distance=80
merge.time-window-minutes=15
merge.fallback-always-merge=true

# live events
event.severity-boost-radius=100

# assignment & escalation
assignment.walking-speed-mps=1.3
escalation.enabled=true
escalation.accept-timeout-seconds=120
escalation.check-interval-ms=30000

# demo: staff walking animation (1 = real speed)
movement.enabled=true
movement.speed-multiplier=5

# accessibility
accessibility.asset-match-radius=40
accessibility.expected-restore-minutes=45

# CORS (comma separated, * = any origin)
cors.allowed-origins=*

# security: false = everything open (plan B for the demo). Switch to true when the frontend has login.
security.enabled=false
security.jwt.secret=change-me-to-a-long-random-secret-at-least-32-chars
security.jwt.expiration-minutes=480

# telegram bot (alert source #5). false = the bot does not start at all
telegram.enabled=true
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.base-url=https://api.telegram.org
telegram.poll-timeout-seconds=30

# gemini gatekeeper for telegram (isReport / cleanText / zoneCode). any failure -> raw text
media-ai.enabled=true
media-ai.provider=gemini
media-ai.api-key=${MEDIA_AI_KEY:}
media-ai.model=gemini-flash-latest
media-ai.fallback-model=gemini-flash-lite-latest
media-ai.timeout-ms=8000
media-ai.audio-timeout-ms=20000

