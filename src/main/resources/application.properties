spring.application.name=Rifd

# Railway gives the port in PORT; locally 8080
server.port=${PORT:8080}

# database: every value comes from the environment on the server, the defaults = local XAMPP
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/rifd?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# create-drop: every restart / deploy wipes the data and DataSeeder fills it again
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.show-sql=false
# local = MariaDB (XAMPP), Railway = real MySQL -> DB_DIALECT=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}

# AI service (any failure / timeout -> rule-based fallback)
ai.base-url=https://basmaalmuntaser-expo-ops-ai.hf.space
ai.timeout-ms=8000
ai.warmup-timeout-ms=90000
ai.enabled=true
ai.min-confidence=0.5

# AI 2 (ExpoGuard): fire/smoke detection on photos. Any failure / timeout -> the photo goes on with the Gemini description only
# private Hugging Face Space: the token comes from the HF_TOKEN environment variable (never written here)
vision-ai.enabled=true
vision-ai.base-url=https://basmaalmuntaser-expoguard-ai.hf.space
vision-ai.token=${HF_TOKEN:}
vision-ai.timeout-ms=10000
vision-ai.warmup-timeout-ms=120000
vision-ai.min-confidence=0.45

# merging
merge.threshold=0.6
merge.max-distance=80
merge.time-window-minutes=15
merge.fallback-always-merge=true

# live events
event.severity-boost-radius=100

# assignment & escalation
assignment.walking-speed-mps=1.3
# HIGH incidents: the recommendation is accepted and staff assigned without waiting for the operator
assignment.auto-assign-high=true
escalation.enabled=true
escalation.accept-timeout-seconds=120
escalation.check-interval-ms=30000

# demo: staff walking animation (1 = real speed)
movement.enabled=true
movement.speed-multiplier=5

# accessibility
accessibility.asset-match-radius=40
accessibility.expected-restore-minutes=45

# CORS (comma separated, * = any origin)
cors.allowed-origins=${CORS_ORIGINS:*}

# security: false = everything open (local dev / plan B). On the server SECURITY_ENABLED=true
# JWT_SECRET on the server = a long random value (openssl rand -base64 48), never written here
security.enabled=${SECURITY_ENABLED:false}
security.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
security.jwt.expiration-minutes=480

# telegram bot (alert source #5). false = the bot does not start at all
# only ONE running copy may poll the same token (else 409) -> locally TELEGRAM_ENABLED=false while the server runs
telegram.enabled=${TELEGRAM_ENABLED:true}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.base-url=https://api.telegram.org
telegram.poll-timeout-seconds=30

# gemini gatekeeper for telegram (isReport / cleanText / zoneCode). any failure -> raw text
media-ai.enabled=true
media-ai.provider=gemini
media-ai.api-key=${MEDIA_AI_KEY:}
media-ai.model=gemini-flash-latest
media-ai.fallback-model=gemini-flash-lite-latest
media-ai.timeout-ms=8000
media-ai.audio-timeout-ms=20000

# whatsapp (UltraMsg, decision 147): W1 new account, W2 HIGH task assigned, W3 escalation
# any failure -> logged and skipped, nothing is blocked. Secrets only from the environment (never written here)
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.base-url=https://api.ultramsg.com
whatsapp.instance=${ULTRAMSG_INSTANCE:}
whatsapp.token=${ULTRAMSG_TOKEN:}
whatsapp.timeout-ms=8000
whatsapp.platform-url=${PLATFORM_URL:}

# email (Brevo HTTPS API: Railway blocks outgoing SMTP, decision 186): E1 new staff account, E2 incident report
# MAIL_FROM = a sender address verified in Brevo. Secrets only from the environment (never written here)
mail.enabled=${MAIL_ENABLED:false}
mail.base-url=https://api.brevo.com
mail.api-key=${BREVO_API_KEY:}
mail.from=${MAIL_FROM:}
mail.from-name=Rifd - Expo 2030
mail.timeout-ms=8000

# web reports with photos / voice (MediaReportService checks 5 MB per file, 3 photos max)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB